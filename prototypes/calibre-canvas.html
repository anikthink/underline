<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibre library window: three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ CANVAS SHELL ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#e4e3df;font:14px/1.4 "Geist",sans-serif;color:#222}
#viewport{position:fixed;inset:0;cursor:grab;overflow:hidden;
  background-image:radial-gradient(#c4c2bc 1px,transparent 1px);background-size:24px 24px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.board{position:absolute;width:1440px}
.board-label{height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:22px;cursor:zoom-in}
.board-label .num{font:500 22px "Geist Mono",monospace;color:#77756f}
.board-label h2{font:700 54px/1 "Geist",sans-serif;letter-spacing:-.02em;margin:6px 0 10px}
.board-label p{font-size:22px;color:#4a4843;max-width:1200px}
.board-label .axes{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px;font:400 16px "Geist Mono",monospace;color:#6a6862}
.board-label .axes span{white-space:nowrap}
.board-label .axes b{color:#222;font-weight:500}
.screen{width:1440px;height:900px;border-radius:14px;overflow:hidden;position:relative;cursor:default;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 24px 60px -20px rgba(0,0,0,.35)}
.intro{width:1440px;height:1050px;padding:150px 80px 0 0}
.intro h1{font:700 110px/0.95 "Geist",sans-serif;letter-spacing:-.04em}
.intro .lede{font-size:28px;line-height:1.4;color:#3d3b37;max-width:1150px;margin:36px 0 44px}
.intro table{border-collapse:collapse;font-size:20px;width:100%}
.intro th{text-align:left;font:500 15px "Geist Mono",monospace;color:#77756f;text-transform:uppercase;letter-spacing:.06em;padding:0 16px 12px 0;border-bottom:2px solid #222}
.intro td{padding:16px 16px 16px 0;border-bottom:1px solid #c9c7c0;vertical-align:top}
.intro td:first-child{font:500 18px "Geist Mono",monospace;color:#77756f;width:60px}
.intro .src{margin-top:36px;font-size:19px;line-height:1.5;color:#4a4843;max-width:1200px}
.intro .src b{color:#222}
.intro .keys{margin-top:22px;font:400 18px "Geist Mono",monospace;color:#5d5b55}
.intro kbd{border:1px solid #9b9890;border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:#f4f3ef;color:#222}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;
  background:#1d1d1b;color:#eee;padding:6px;border-radius:10px;z-index:10;font:500 13px "Geist",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
#hud button{all:unset;cursor:pointer;padding:7px 11px;border-radius:6px;color:#d8d6d0}
#hud button:hover{background:#34332f;color:#fff}
#hud button:focus-visible{outline:2px solid #8ab4ff}
#hud .sep{width:1px;height:20px;background:#3c3b37;margin:0 4px}
#hud #zoomPct{font-family:"Geist Mono",monospace;min-width:52px;text-align:center;color:#a9a7a0}
#hud #src{font:400 12px "Geist Mono",monospace;color:#a9a7a0;padding:0 8px}
#hud #src i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9a227;margin-right:7px;vertical-align:1px}
#hud #src.live i{background:#3fb950}

/* shared cover primitive: real cover image over a typographic fallback */
.cv{position:relative;background:var(--c1);color:var(--c2);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.cv .cv-t,.cv .cv-a{display:block;overflow-wrap:anywhere}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ============ OPTION 1 — READING ROOM ============ */
.o1{background:#f3ede2;color:#1f1b16;font:15px/1.5 "Public Sans",sans-serif;height:100%;display:grid;grid-template-rows:76px 1fr 38px}
.o1 button,.o1 select{font:inherit;cursor:pointer}
.o1 :focus-visible{outline:2px solid #8a2c1d;outline-offset:2px}
.o1 .mast{display:flex;align-items:center;gap:40px;padding:0 44px;border-bottom:1px solid #d9cfbd}
.o1 .wm{font:800 30px "Fraunces",serif;letter-spacing:-.02em}
.o1 .wm span{font-weight:400;font-style:italic;color:#8a2c1d}
.o1 nav{display:flex;gap:26px;font-size:15px}
.o1 nav a{color:#6b6156;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.o1 nav a.on{color:#1f1b16;border-color:#1f1b16}
.o1 .find{margin-left:auto;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1f1b16;padding:6px 2px;width:300px}
.o1 .find input{border:0;background:none;font:italic 16px "Fraunces",serif;width:100%;color:#1f1b16;outline:none}
.o1 .btn-ink{background:#1f1b16;color:#f3ede2;border:0;border-radius:3px;padding:10px 18px;font-weight:600;white-space:nowrap}
.o1 .btn-ink:hover{background:#8a2c1d}
.o1 .cols{display:grid;grid-template-columns:210px 1fr 380px;min-height:0}
.o1 .index{padding:30px 24px 30px 44px;border-right:1px solid #d9cfbd;overflow:auto}
.o1 .index h4{font:600 11px "Public Sans";letter-spacing:.14em;text-transform:uppercase;color:#8b7f70;margin:22px 0 8px}
.o1 .index h4:first-child{margin-top:0}
.o1 .index button{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:0;padding:4px 0;text-align:left;color:#3a332b;font-size:14px}
.o1 .index button:hover,.o1 .index button.on{color:#8a2c1d}
.o1 .index button.on{font-weight:600}
.o1 .index button i{font-style:normal;color:#a3978a;font-variant-numeric:tabular-nums}
.o1 .spread{padding:44px 44px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;overflow:hidden;align-content:start}
.o1 .spread .cv{width:240px;height:360px;padding:28px 24px;box-shadow:12px 14px 0 -2px #d9cfbd;border-radius:2px 4px 4px 2px}
.o1 .cv .cv-t{font:800 34px/1.02 "Fraunces",serif;letter-spacing:-.01em}
.o1 .cv .cv-a{font:500 13px "Public Sans";letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.o1 .meta-top{font-size:13px;color:#8b7f70;letter-spacing:.04em}
.o1 h1{font:600 56px/1 "Fraunces",serif;letter-spacing:-.03em;margin:10px 0 8px;max-width:620px}
.o1 .subt{font:italic 20px/1.3 "Fraunces",serif;color:#6b6156;margin-bottom:10px}
.o1 .by{font:italic 22px "Fraunces",serif;color:#4a4036}
.o1 .by b{font-style:normal;font-weight:600;color:#1f1b16}
.o1 .desc{margin:22px 0;max-width:580px;font-size:16px;line-height:1.65;color:#3a332b}
.o1 .desc::first-letter{font:600 58px/0.8 "Fraunces",serif;float:left;margin:6px 10px 0 0;color:#8a2c1d}
.o1 .facts{display:grid;grid-template-columns:repeat(3,auto);gap:14px 40px;justify-content:start;padding:18px 0;border-top:1px solid #d9cfbd;border-bottom:1px solid #d9cfbd;max-width:580px}
.o1 .facts dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b7f70}
.o1 .facts dd{font-size:15px;font-weight:500}
.o1 .acts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:26px}
.o1 .acts button{white-space:nowrap}
.o1 .acts .lnk{background:none;border:0;color:#1f1b16;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#c2b6a4}
.o1 .acts .lnk:hover{text-decoration-color:#8a2c1d;color:#8a2c1d}
.o1 .progress{margin-top:22px;font-size:13px;color:#6b6156;max-width:580px}
.o1 .progress .bar{height:3px;background:#d9cfbd;margin-top:6px}
.o1 .progress .bar span{display:block;height:100%;background:#8a2c1d}
.o1 .shelf{border-left:1px solid #d9cfbd;display:flex;flex-direction:column;min-height:0;background:#efe7d9}
.o1 .shelf-h{display:flex;justify-content:space-between;align-items:baseline;padding:30px 32px 14px}
.o1 .shelf-h h3{font:600 26px "Fraunces",serif}
.o1 .shelf-h select{background:none;border:0;font:13px "Public Sans";color:#6b6156}
.o1 .list{overflow:auto;padding:0 20px 20px}
.o1 .row{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-bottom:1px dotted #c9bda9;color:inherit;border-radius:3px;align-items:center}
.o1 .row:hover{background:#e6dccb}
.o1 .row.on{background:#1f1b16;color:#f3ede2}
.o1 .row.on .a,.o1 .row.on .f{color:#cdbfaa}
.o1 .row .cv{width:34px;height:50px;border-radius:2px;grid-row:1/3}
.o1 .row .cv span{display:none}
.o1 .row .t{font:500 17px/1.2 "Fraunces",serif}
.o1 .row .a{font-size:13px;color:#7b7064}
.o1 .row .f{grid-row:1/3;grid-column:3;align-self:center;font-size:11px;letter-spacing:.08em;color:#8b7f70}
.o1 .status{display:flex;gap:28px;align-items:center;padding:0 44px;border-top:1px solid #d9cfbd;font-size:12.5px;color:#6b6156}
.o1 .status .dev{margin-left:auto;color:#1f1b16}
.o1 .stag>*{animation:o1in .6s cubic-bezier(.2,.7,.2,1) both}
.o1 .stag>*:nth-child(2){animation-delay:.05s}.o1 .stag>*:nth-child(3){animation-delay:.1s}
.o1 .stag>*:nth-child(4){animation-delay:.15s}.o1 .stag>*:nth-child(5){animation-delay:.2s}
.o1 .stag>*:nth-child(6){animation-delay:.25s}.o1 .stag>*:nth-child(7){animation-delay:.3s}.o1 .stag>*:nth-child(8){animation-delay:.35s}
@keyframes o1in{from{opacity:0;transform:translateY(14px)}}
.o1 .spread>.cv{animation:o1cv .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes o1cv{from{opacity:0;transform:translateX(-18px) rotate(-1.5deg)}}

/* ============ OPTION 2 — COMMAND DECK ============ */
.o2{--bg:#0e1014;--p1:#14171d;--p2:#1a1e26;--ln:#252a34;--tx:#d7dbe2;--mu:#7d8594;--ac:#f5a524;
  background:var(--bg);color:var(--tx);font:13px/1.4 "IBM Plex Sans",sans-serif;height:100%;display:grid;grid-template-rows:46px 1fr 28px;position:relative}
.o2 .mono{font-family:"JetBrains Mono",monospace}
.o2 button{font:inherit;color:inherit;cursor:pointer}
.o2 :focus-visible{outline:1px solid var(--ac);outline-offset:1px}
.o2 .top{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--ln);background:var(--p1)}
.o2 .lib{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;background:none;border:1px solid var(--ln);font-weight:500;margin-right:8px}
.o2 .lib i{width:8px;height:8px;border-radius:2px;background:var(--ac);display:inline-block}
.o2 .tb{background:none;border:0;padding:6px 10px;border-radius:5px;color:#b9bfca}
.o2 .tb:hover{background:var(--p2);color:#fff}
.o2 .tb.pri{color:var(--ac)}
.o2 .cmd{margin-left:auto;display:flex;align-items:center;gap:10px;width:380px;padding:6px 10px;background:var(--bg);border:1px solid var(--ln);border-radius:5px;color:var(--mu);text-align:left}
.o2 .cmd:hover{border-color:#3a4150}
.o2 .cmd kbd{margin-left:auto;font:11px "JetBrains Mono";border:1px solid var(--ln);border-radius:3px;padding:0 5px}
.o2 .body{display:grid;grid-template-columns:230px 1fr 330px;min-height:0}
.o2 .tree{border-right:1px solid var(--ln);overflow:auto;padding:8px 0;background:var(--p1)}
.o2 .grp>button{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:5px 12px;text-align:left;color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.o2 .grp>button::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.o2 .grp.open>button::before{transform:rotate(90deg)}
.o2 .grp ul{list-style:none;display:none;padding-bottom:6px}
.o2 .grp.open ul{display:block}
.o2 .grp li button{display:flex;width:100%;justify-content:space-between;gap:8px;background:none;border:0;padding:3px 12px 3px 26px;text-align:left;color:#c3c8d1}
.o2 .grp li button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o2 .grp li button:hover{background:var(--p2)}
.o2 .grp li button.on{background:rgba(245,165,36,.12);color:var(--ac)}
.o2 .grp li span:last-child{font:11px "JetBrains Mono";color:var(--mu)}
.o2 .tbl{overflow:auto;min-width:0}
.o2 table{width:100%;border-collapse:collapse;table-layout:fixed}
.o2 th{position:sticky;top:0;background:var(--p1);text-align:left;font-weight:500;color:var(--mu);font-size:11.5px;padding:0 10px;height:30px;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none;white-space:nowrap}
.o2 th:hover{color:var(--tx)}
.o2 th.sorted{color:var(--ac)}
.o2 th.sorted::after{content:" ↓"}
.o2 th.sorted.asc::after{content:" ↑"}
.o2 td{padding:0 10px;height:29px;border-bottom:1px solid #171a21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o2 tbody tr{cursor:default;transition:background .1s}
.o2 tbody tr:hover{background:#161a21}
.o2 tbody tr.on{background:rgba(245,165,36,.10);box-shadow:inset 2px 0 var(--ac)}
.o2 td.r{color:var(--ac);letter-spacing:-1px;font-size:11px}
.o2 td.n{font:12px "JetBrains Mono";color:#9aa2b0}
.o2 .fmt{font:10.5px "JetBrains Mono";color:#9aa2b0;margin-right:6px}
.o2 .insp{border-left:1px solid var(--ln);background:var(--p1);overflow:auto;padding:16px}
.o2 .insp-h{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end}
.o2 .insp .cv{width:96px;height:144px;padding:10px 8px;border-radius:3px}
.o2 .cv .cv-t{font:600 13px/1.1 "IBM Plex Sans"}
.o2 .cv .cv-a{font:10px "JetBrains Mono";opacity:.8}
.o2 .insp h3{font-size:18px;font-weight:600;line-height:1.2}
.o2 .insp .au{color:var(--mu);margin-top:3px}
.o2 .kv{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;margin:18px 0;font-size:12px}
.o2 .kv dt{color:var(--mu)}
.o2 .kv dd{font-family:"JetBrains Mono",monospace;font-size:11.5px;overflow-wrap:anywhere}
.o2 .insp p{color:#aab1bd;line-height:1.55;font-size:12.5px}
.o2 .insp .row{display:flex;gap:6px;margin-top:16px}
.o2 .ib{flex:1;background:var(--p2);border:1px solid var(--ln);padding:7px 0;border-radius:5px}
.o2 .ib:hover{border-color:#3a4150}
.o2 .ib.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
.o2 .status{display:flex;align-items:center;gap:20px;padding:0 12px;border-top:1px solid var(--ln);background:var(--p1);color:var(--mu);font:11px "JetBrains Mono"}
.o2 .status .job{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--tx)}
.o2 .status .meter{width:90px;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.o2 .status .meter span{display:block;height:100%;width:62%;background:var(--ac);animation:o2m 6s linear infinite}
@keyframes o2m{0%{width:20%}100%{width:96%}}
.o2 .pal-bg{position:absolute;inset:0;background:rgba(5,6,8,.55);display:none;align-items:flex-start;justify-content:center;padding-top:110px;z-index:5}
.o2 .pal-bg.open{display:flex}
.o2 .pal{width:620px;background:var(--p2);border:1px solid #333a47;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:o2p .14s ease-out}
@keyframes o2p{from{opacity:0;transform:translateY(-6px) scale(.985)}}
.o2 .pal input{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);padding:16px 18px;font:15px "IBM Plex Sans";color:var(--tx);outline:none}
.o2 .pal ul{list-style:none;max-height:360px;overflow:auto;padding:6px}
.o2 .pal li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:6px;color:#c3c8d1;cursor:pointer}
.o2 .pal li.hi{background:rgba(245,165,36,.12);color:#fff}
.o2 .pal li small{font:11px "JetBrains Mono";color:var(--mu)}
.o2 .pal .sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:10px 12px 4px}

/* ============ OPTION 3 — QUEUE (Linear-inspired) ============ */
.o3{--out:#08090a;--panel:#101113;--raise:#17181b;--pop:#1c1d21;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.11);
  --tx:#ecedee;--tx2:#c9cbcf;--mu:#8a8f98;--fa:#62666d;--hv:rgba(255,255,255,.035);--sel:rgba(255,255,255,.06);
  --ac:#5e6ad2;--ac2:#7c85e0;--prog:#f2c94c;--done:#4cb782;--star:#f5a524;--shadow:0 16px 48px rgba(0,0,0,.55);
  background:var(--out);color:var(--tx);font:13px/1.45 "Inter",sans-serif;height:100%;display:grid;grid-template-columns:232px 1fr;position:relative;
  font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
.o3[data-theme=light]{--out:#f4f5f8;--panel:#fff;--raise:#f7f8fa;--pop:#fff;--ln:#e8e9ed;--ln2:#dcdde2;--tx:#1b1c1f;--tx2:#3c3f44;--mu:#6b6f76;--fa:#9a9ea6;
  --hv:rgba(0,0,0,.025);--sel:rgba(94,106,210,.07);--done:#2f9e63;--star:#e3920b;--prog:#d9a400;--shadow:0 16px 48px rgba(20,20,40,.16)}
.o3 button,.o3 input{font:inherit;color:inherit}
.o3 button{cursor:pointer;background:none;border:0}
.o3 :focus-visible{outline:2px solid var(--ac);outline-offset:-1px;border-radius:5px}
.o3 svg{display:block;flex:none}
/* sidebar */
.o3 .sb{display:flex;flex-direction:column;padding:10px 8px;gap:2px;min-height:0}
.o3 .ws{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px}
.o3 .ws .lg{width:20px;height:20px;display:block;flex:none}
.o3 .ws b{font-weight:600;font-size:13px}
.o3 .ws .ic{margin-left:auto;display:flex;gap:2px}
.o3 .ws .ic button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--mu)}
.o3 .ws .ic button:hover{background:var(--hv);color:var(--tx)}
.o3 .nv{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:6px;color:var(--tx2);text-align:left;font-weight:500}
.o3 .nv:hover{background:var(--hv)}
.o3 a.nv{text-decoration:none}
.o3 .nv .ul{width:14px;display:grid;place-items:center}.o3 .nv .ul i{width:12px;height:2px;border-radius:1px;background:var(--prog)}
.o3 .nv.on{background:var(--sel);color:var(--tx)}
.o3 .nv .ct{margin-left:auto;color:var(--fa);font-size:12px;font-weight:400}
.o3 .nv .dot{width:9px;height:9px;border-radius:50%;margin:0 2px}
.o3 .sec{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 4px;font-size:11.5px;font-weight:500;color:var(--fa)}
.o3 .dev{display:flex;align-items:center;gap:9px;padding:5px 8px;color:var(--tx2);font-weight:500;white-space:nowrap}
.o3 .dev small{margin-left:auto;font-weight:400;color:var(--fa);font-size:11.5px}
.o3 .dev .led{flex:none;width:7px;height:7px;border-radius:50%;background:#4cb782;margin:0 3px}
.o3 .dev .led.off{background:var(--fa)}
.o3 .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.o3 .job{display:flex;align-items:center;gap:9px;padding:6px 8px;color:var(--mu);font-size:12px}
.o3 .job .ring{animation:o3spin 1.4s linear infinite}
@keyframes o3spin{to{transform:rotate(360deg)}}
.o3 .theme{display:flex;gap:2px;padding:3px;background:var(--hv);border-radius:7px;margin:4px 8px 0}
.o3 .theme button{flex:1;padding:3px 0;border-radius:5px;font-size:12px;color:var(--mu)}
.o3 .theme button.on{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--ln)}
/* main panel */

    hi = Math.min(hi, Math.max(items.length - 1, 0));
    let html = "", i = 0;
    const sec = (name, arr) => { if (!arr.length) return; html += `<div class="sec">${name}</div>`; arr.forEach(it => { html += `<li class="${i === hi ? "hi" : ""}" data-i="${i}">${esc(it.label)}<small>${esc(it.hint)}</small></li>`; i++; }); };

  const openPal = () => { bg.classList.add("open"); inp.value = ""; hi = 0; drawPal(); inp.focus({preventScroll: true}); };

  root.querySelector(".cmd").addEventListener("click", openPal);
  bg.addEventListener("click", e => { if (e.target === bg) closePal(); const li = e.target.closest("li[data-i]"); if (li) pick(items[+li.dataset.i]); });
  inp.addEventListener("input", () => { hi = 0; drawPal(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "Escape") closePal();

    else if (e.key === "ArrowUp") { hi = Math.max(hi - 1, 0); drawPal(); e.preventDefault(); }
    else if (e.key === "Enter") pick(items[hi]);
    e.stopPropagation();
  });
  root.openPal = openPal;
  draw();
}

/* Status icons: a bookmark. Outline = not started, fills from the top in quarter steps while reading, green with a check when finished. */
let iconUid = 0;
const BOOKMARK = "M4.5 2.25h7v11.5L8 11.1l-3.5 2.65z";
function statusIcon(st, prog = 0) {
  const svg = inner => `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  if (st === "finished") return svg(`<path d="${BOOKMARK}" fill="var(--done)" stroke="var(--done)" stroke-width="1.4"/><path d="m6.1 6.4 1.4 1.4 2.5-2.7" stroke="#fff" stroke-width="1.4"/>`);
  if (st === "reading") {
    // Three fill steps: under 37.5% read shows a quarter, 37.5–62.5% half, above 62.5% three quarters.
    const fill = prog < 37.5 ? .25 : prog <= 62.5 ? .5 : .75;
    const id = "bm" + (++iconUid), h = (8.85 * fill + .25).toFixed(2); // measured against the solid body above the notch (y 2.25–11.1)
    return svg(`<defs><clipPath id="${id}"><rect x="0" y="2" width="16" height="${h}"/></clipPath></defs><path d="${BOOKMARK}" fill="var(--prog)" clip-path="url(#${id})"/><path d="${BOOKMARK}" stroke="var(--prog)" stroke-width="1.4"/>`);
  }
  return svg(`<path d="${BOOKMARK}" stroke="var(--mu)" stroke-width="1.4"/>`);
}

/* ============ LIVE GOOGLE BOOKS (Open Library is the fallback) ============ */
const srcEl = document.getElementById("src");
function setSource(text, live) { srcEl.innerHTML = `<i></i>${text}`; srcEl.classList.toggle("live", live); }
const stripHtml = s => (s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
const trimDesc = s => { let out = ""; for (const p of s.split(/(?<=[.!?])\s+/)) { if (out && out.length + p.length > 340) break; out += (out ? " " : "") + p; } return out; };
async function loadGoogle() {
  const key = localStorage.getItem("gbooks-key") || "";
  setSource("Google Books…", false);
  try {
    const infos = await Promise.all(OPEN_LIBRARY.map(async b => {
      if (!b.isbn) return null;
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${b.isbn}${key ? `&key=${encodeURIComponent(key)}` : ""}`);
      const j = await r.json();
      if (j.error) throw new Error(j.error.message);
      return j.items?.[0]?.volumeInfo || null;
    }));
    if (!infos.some(Boolean)) throw new Error("no matches");
    const merged = OPEN_LIBRARY.map((b, i) => {
      const v = infos[i]; if (!v) return b;
      const g = {...b};
      if (v.subtitle) g.sub = v.subtitle;
      if (v.authors?.length) { g.a = v.authors[0]; g.sk = g.a.split(" ").pop(); }
      if (v.publisher) g.pub = v.publisher.replace(/^"|"$/g, "");
      if (v.publishedDate) g.ed = v.publishedDate.slice(0, 4);
      if (v.pageCount) g.pages = v.pageCount;
      if (v.description) g.d = trimDesc(stripHtml(v.description));
      if (v.averageRating) g.olr = v.averageRating;
      if (!g.cover && v.imageLinks?.thumbnail) g.cover = v.imageLinks.thumbnail.replace("http://", "https://");
      return g;
    });
    SOURCE = "google"; buildBooks(merged); mountAll();
    setSource(`Google Books · ${infos.filter(Boolean).length}/${infos.length} live`, true);
  } catch (err) {
    SOURCE = "openlibrary";
    setSource("Open Library (Google Books unavailable)", false);
    srcEl.title = "Google Books: " + err.message;
    console.info("Google Books unavailable, showing the Open Library snapshot:", err.message);
  }
}

  if (k === null) return;

  e.preventDefault(); tx -= e.deltaX; ty -= e.deltaY; apply();
}, {passive: false});
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); const z = e.target.closest("[data-z]"); if (z) zoomAt(s * (z.dataset.z > 0 ? 1.25 : 0.8), innerWidth / 2, innerHeight / 2); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); go(2); setTimeout(() => document.getElementById("o2").openPal(), 460); return; }
  if (e.target.matches("input,textarea,select") || e.target.closest(".screen")) return;
  if (/^[1-3]$/.test(e.key)) go(+e.key);
  if (e.key === "0") fitAll();
});
addEventListener("resize", fitAll);
[vp, document.scrollingElement].forEach(el => el && el.addEventListener("scroll", () => { el.scrollTop = 0; el.scrollLeft = 0; }));
addEventListener("scroll", () => scrollTo(0, 0));
fitAll();
</script>
