[package]
name = "nightstand"
version = "0.1.0"
description = "Nightstand, a desktop ebook app"
authors = ["anikthink"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue, see cargo#8519)
name = "nightstand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
dirs = "6"
tempfile = "3"
libc = "0.2"
unicode-normalization = "0.1"
regex = "1"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
